# Entity-resolution policy er-v1: configuration values for the local bounded run.
# Owner: entity-resolution-engineer. Non-secret.
#
# The four thresholds below reach the policy only through the core
# configuration loader (section scholarchain.entityResolution), which binds these
# environment variables in core's scholarchain/env-overrides.conf. Export them before a
# run, for example:
#
#   env $(grep -v '^#' modules/entity-resolution/config/er-v1-thresholds.properties | xargs) \
#     SCHOLARCHAIN_ENV=dev sbt "entityResolution/runMain scholarchain.er.run.ResolveSample ..."
#
# Semantics (half-open, see scholarchain.er.policy.Thresholds):
#   score >= ACCEPT                 -> ACCEPTED
#   score <  REJECT                 -> REJECTED
#   LLM_BAND_MIN <= score < LLM_BAND_MAX -> LLM adjudication (when an adjudicator is configured)
#   otherwise                       -> UNRESOLVED (human review)
# Core enforces REJECT <= LLM_BAND_MIN <= LLM_BAND_MAX <= ACCEPT.
#
# Gating cutoffs (minSurnameSimilarity, minSharedIdTitleSimilarity, llmMinConfidence; policy
# revision er-v1-r2, Phase 05 repair-01 F7) are read by the code from THIS file only. The path is
# passed explicitly, never built in:
#
#   sbt "entityResolution/runMain scholarchain.er.run.ResolveSample ...
#        --er-policy-properties modules/entity-resolution/config/er-v1-thresholds.properties"
#
# There is no default and no fallback: a missing, blank, duplicated, non-numeric, NaN or
# out-of-[0, 1] value stops the run. The run manifest records each value, its source
# (properties-file:er-v1-thresholds.properties#<key>) and the SHA-256 of this file, so any edit
# here gives a new run ID. The env-export command above also exports these three lines; the core
# loader ignores them because it binds only the SCHOLARCHAIN_ER_* variables.
#
# Set a priori for er-v1 before any human label existed. They must not be tuned on the
# gold set (Phase 05 work order, part B).
SCHOLARCHAIN_ER_POLICY_VERSION=er-v1
SCHOLARCHAIN_ER_ACCEPT_THRESHOLD=0.80
SCHOLARCHAIN_ER_REJECT_THRESHOLD=0.45
SCHOLARCHAIN_ER_LLM_BAND_MIN=0.60
SCHOLARCHAIN_ER_LLM_BAND_MAX=0.80
minSurnameSimilarity=0.85
minSharedIdTitleSimilarity=0.5
llmMinConfidence=0.7

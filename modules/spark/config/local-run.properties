# Spark analytics (Phase 06 PART A and PART B) configuration values for the LOCAL bounded run.
# Owner: spark-engineer. Non-secret. No shipped default exists in core for any of these keys;
# the core loader reads them only through the environment variables bound in core's
# scholarchain/env-overrides.conf (entity-resolution properties-file precedent). Export them
# before a run, from the repository root:
#
#   env $(grep -v '^#' modules/spark/config/local-run.properties | xargs) \
#     sbt "sparkAnalytics/runMain scholarchain.spark.run.GraphPipeline --local --code-version <git-sha>"
#
# Relative paths resolve from the repository root (the forked runner's working directory).
# graph.windows and the DBLP subset years come from core's dev.conf (SCHOLARCHAIN_ENV=dev).
SCHOLARCHAIN_ENV=dev
SCHOLARCHAIN_GRAPH_COAUTHOR_POLICY_VERSION=sc-coauthor-edge-policy-v1
SCHOLARCHAIN_GRAPH_INCLUDE_ALL_YEARS_WINDOW=true
SCHOLARCHAIN_GRAPH_REPRESENTATIVE_WORK_LIMIT=5
SCHOLARCHAIN_GRAPH_IDENTITY_VERSION=v1
SCHOLARCHAIN_GRAPH_IDENTITY_MAX_CLUSTER_SIZE=50
SCHOLARCHAIN_GRAPH_COMPONENTS_MAX_ITERATIONS=50
SCHOLARCHAIN_SPARK_HADOOP_INPUT_ROOT=target/phase04/run-b4
SCHOLARCHAIN_SPARK_HADOOP_RUN_ID=run:fa68b48b0cfb87ca7514ba90feeeabdb926a3cb60fb6a9483affdb4169fdb315
SCHOLARCHAIN_SPARK_MATCH_DECISIONS_DIR=modules/entity-resolution/local-run/er-v1/run_id=7449422852604780fd2de54fcaa1ff18ebe1cf761c260d8cf4de08b368ce4e15
SCHOLARCHAIN_SPARK_OUTPUT_ROOT=modules/spark/local-run
SCHOLARCHAIN_SPARK_SHUFFLE_PARTITIONS=8
SCHOLARCHAIN_SPARK_CHECKPOINT_DIR=modules/spark/target/spark-checkpoints
SCHOLARCHAIN_SPARK_CHECKPOINT_INTERVAL=3
# PART B (paths, communities, k-core, distance estimate, semantic facts). No benchmark pairs are
# configured, so graph.paths.samplePairCount pairs are drawn per window with graph.paths.seed.
SCHOLARCHAIN_COMMUNITY_ALGORITHM=label-propagation
SCHOLARCHAIN_COMMUNITY_MAX_ITERATIONS=30
SCHOLARCHAIN_GRAPH_KCORE_MAX_ITERATIONS=100
SCHOLARCHAIN_GRAPH_PATHS_MAX_DEPTH=6
SCHOLARCHAIN_GRAPH_PATHS_SAMPLE_PAIR_COUNT=5
SCHOLARCHAIN_GRAPH_PATHS_SEED=20261121
SCHOLARCHAIN_GRAPH_DIAMETER_SAMPLE_SOURCES=4
SCHOLARCHAIN_GRAPH_DIAMETER_SEED=20261122
SCHOLARCHAIN_GRAPH_DIAMETER_MIN_COMPONENT_SIZE=3
SCHOLARCHAIN_GRAPH_SEMANTIC_TOP_ENTITY_LIMIT=5
SCHOLARCHAIN_GRAPH_SEMANTIC_MEMBER_LIMIT=10

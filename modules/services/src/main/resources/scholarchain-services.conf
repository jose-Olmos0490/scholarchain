# ScholarChain services configuration (owner: service-engineer).
#
# Every value can be overridden by its environment variable. serving.runId and
# serving.snapshot have no value of their own: the deployment must set them.
# API keys are NOT configured here: they come from AWS Secrets Manager by
# secret name (auth.keySecretName, providerKeys.*SecretName).
scholarchain.services {
  http {
    maxBodyBytes = 65536
    maxBodyBytes = ${?SCHOLARCHAIN_SVC_MAX_BODY_BYTES}
    maxQuestionChars = 2000
    maxQuestionChars = ${?SCHOLARCHAIN_SVC_MAX_QUESTION_CHARS}
    maxListItems = 20
    maxListItems = ${?SCHOLARCHAIN_SVC_MAX_LIST_ITEMS}
    idempotencyKeyMinChars = 8
    idempotencyKeyMaxChars = 128
  }
  rateLimit {
    requestsPerWindow = 120
    requestsPerWindow = ${?SCHOLARCHAIN_SVC_RATE_LIMIT_REQUESTS}
    windowSeconds = 60
    windowSeconds = ${?SCHOLARCHAIN_SVC_RATE_LIMIT_WINDOW_SECONDS}
  }
  breaker {
    failureThreshold = 5
    failureThreshold = ${?SCHOLARCHAIN_SVC_BREAKER_FAILURES}
    openMillis = 30000
    openMillis = ${?SCHOLARCHAIN_SVC_BREAKER_OPEN_MILLIS}
  }
  retry {
    readRetries = 2
    readRetries = ${?SCHOLARCHAIN_SVC_READ_RETRIES}
    backoffMillis = 50
    backoffMillis = ${?SCHOLARCHAIN_SVC_RETRY_BACKOFF_MILLIS}
    readTimeoutMillis = 2000
    readTimeoutMillis = ${?SCHOLARCHAIN_SVC_READ_TIMEOUT_MILLIS}
  }
  serving {
    runId = ${?SCHOLARCHAIN_SVC_RUN_ID}
    snapshot = ${?SCHOLARCHAIN_SVC_SNAPSHOT}
  }
  execution {
    workerThreads = 8
    workerThreads = ${?SCHOLARCHAIN_SVC_WORKER_THREADS}
    queueCapacity = 32
    queueCapacity = ${?SCHOLARCHAIN_SVC_QUEUE_CAPACITY}
  }
  evidence {
    contentMaxChars = 600
    contentMaxChars = ${?SCHOLARCHAIN_SVC_EVIDENCE_CONTENT_MAX_CHARS}
  }
  graph {
    neighborMaxDepth = 1
    edgeTypes = ["COAUTHORED_WITH"]
  }
  ops {
    metricsEnabled = false
    metricsEnabled = ${?SCHOLARCHAIN_SVC_METRICS_ENABLED}
    readinessTimeoutMillis = 1000
    readinessTimeoutMillis = ${?SCHOLARCHAIN_SVC_READINESS_TIMEOUT_MILLIS}
  }
  auth {
    keySecretName = ${?SCHOLARCHAIN_SVC_KEY_SECRET_NAME}
    maxTokenChars = 256
    maxTokenChars = ${?SCHOLARCHAIN_SVC_AUTH_MAX_TOKEN_CHARS}
    keyRefreshSeconds = 300
    keyRefreshSeconds = ${?SCHOLARCHAIN_SVC_KEY_REFRESH_SECONDS}
    # Failed authentication attempts per source. trustedProxyHops = 0 ignores X-Forwarded-For
    # and uses the TCP peer. Behind one ALB set 1: the entry the ALB appended is the client.
    failures {
      maxFailures = 10
      maxFailures = ${?SCHOLARCHAIN_SVC_AUTH_MAX_FAILURES}
      windowSeconds = 300
      windowSeconds = ${?SCHOLARCHAIN_SVC_AUTH_FAILURE_WINDOW_SECONDS}
      maxTrackedSources = 10000
      maxTrackedSources = ${?SCHOLARCHAIN_SVC_AUTH_MAX_TRACKED_SOURCES}
      trustedProxyHops = 0
      trustedProxyHops = ${?SCHOLARCHAIN_SVC_TRUSTED_PROXY_HOPS}
    }
  }

  # Model-provider API keys (query API: both providers; embedding worker: embedding only).
  # The secret value is the API key as a plain string. A name is required only when its
  # provider is selected; Bedrock needs none.
  providerKeys {
    anthropicSecretName = ${?SCHOLARCHAIN_SVC_ANTHROPIC_KEY_SECRET_NAME}
    voyageSecretName = ${?SCHOLARCHAIN_SVC_VOYAGE_KEY_SECRET_NAME}
    refreshSeconds = 300
    refreshSeconds = ${?SCHOLARCHAIN_SVC_PROVIDER_KEY_REFRESH_SECONDS}
    retrySeconds = 10
    retrySeconds = ${?SCHOLARCHAIN_SVC_PROVIDER_KEY_RETRY_SECONDS}
    readTimeoutMillis = 2000
    readTimeoutMillis = ${?SCHOLARCHAIN_SVC_PROVIDER_KEY_READ_TIMEOUT_MILLIS}
  }

  # ---- the deployable entrypoints (each reads only its own section) ---------------------------
  queryApi.bind {
    host = "0.0.0.0"
    host = ${?SCHOLARCHAIN_QUERY_API_HOST}
    port = 8080
    port = ${?SCHOLARCHAIN_QUERY_API_PORT}
  }
  graphEvidenceApi.bind {
    host = "0.0.0.0"
    host = ${?SCHOLARCHAIN_GRAPH_API_HOST}
    port = 8081
    port = ${?SCHOLARCHAIN_GRAPH_API_PORT}
  }
  # Model calls: bounded retries with exponential backoff, and a per-attempt deadline.
  # llm.provider = bedrock uses all four keys. With anthropic only the two delays apply
  # (attempts and deadline are SCHOLARCHAIN_ANTHROPIC_MAX_RETRIES / _REQUEST_TIMEOUT_MS).
  llm {
    maxAttempts = 3
    maxAttempts = ${?SCHOLARCHAIN_SVC_LLM_MAX_ATTEMPTS}
    baseDelayMs = 200
    baseDelayMs = ${?SCHOLARCHAIN_SVC_LLM_BASE_DELAY_MS}
    maxDelayMs = 2000
    maxDelayMs = ${?SCHOLARCHAIN_SVC_LLM_MAX_DELAY_MS}
    attemptTimeoutMillis = 20000
    attemptTimeoutMillis = ${?SCHOLARCHAIN_SVC_LLM_ATTEMPT_TIMEOUT_MILLIS}
  }
  # promptsDir has no value of its own: the image or deployment names the directory.
  workflow {
    promptsDir = ${?SCHOLARCHAIN_SVC_PROMPTS_DIR}
    synthesisPromptVersion = "answer-synthesis-prompt-v3"
    synthesisPromptVersion = ${?SCHOLARCHAIN_SVC_SYNTHESIS_PROMPT_VERSION}
    synthesisSchemaVersion = "answer-synthesis-v2"
    synthesisSchemaVersion = ${?SCHOLARCHAIN_SVC_SYNTHESIS_SCHEMA_VERSION}
    stageTimeoutMillis = 8000
    stageTimeoutMillis = ${?SCHOLARCHAIN_SVC_STAGE_TIMEOUT_MILLIS}
    defaultWindowStartYear = ${?SCHOLARCHAIN_SVC_DEFAULT_WINDOW_START_YEAR}
    defaultWindowEndYear = ${?SCHOLARCHAIN_SVC_DEFAULT_WINDOW_END_YEAR}
    plannerMaxQueryCodePoints = 2000
    plannerMaxQueryCodePoints = ${?SCHOLARCHAIN_SVC_PLANNER_MAX_QUERY_CODE_POINTS}
    maxExcerptCodePoints = 600
    maxExcerptCodePoints = ${?SCHOLARCHAIN_SVC_MAX_EXCERPT_CODE_POINTS}
    maxSemanticQueryCodePoints = 1000
    maxSemanticQueryCodePoints = ${?SCHOLARCHAIN_SVC_MAX_SEMANTIC_QUERY_CODE_POINTS}
  }
  # The embedding worker. The queue URLs have no value of their own (Terraform output).
  embeddingWorker {
    health {
      host = "0.0.0.0"
      host = ${?SCHOLARCHAIN_WORKER_HEALTH_HOST}
      port = 8082
      port = ${?SCHOLARCHAIN_WORKER_HEALTH_PORT}
    }
    queueUrl = ${?SCHOLARCHAIN_SVC_EMBEDDING_QUEUE_URL}
    deadLetterQueueUrl = ${?SCHOLARCHAIN_SVC_EMBEDDING_DLQ_URL}
    consumer {
      batchSize = 1
      batchSize = ${?SCHOLARCHAIN_SVC_WORKER_BATCH_SIZE}
      # must exceed maxIngestRunSeconds (checked at start-up)
      visibilityTimeoutSeconds = 1800
      visibilityTimeoutSeconds = ${?SCHOLARCHAIN_SVC_WORKER_VISIBILITY_TIMEOUT_SECONDS}
      waitSeconds = 20
      waitSeconds = ${?SCHOLARCHAIN_SVC_WORKER_WAIT_SECONDS}
      maxReceiveCount = 5
      maxReceiveCount = ${?SCHOLARCHAIN_SVC_WORKER_MAX_RECEIVE_COUNT}
      maxMessagesPerRun = 10
      maxMessagesPerRun = ${?SCHOLARCHAIN_SVC_WORKER_MAX_MESSAGES_PER_RUN}
      retryBackoffSeconds = 60
      retryBackoffSeconds = ${?SCHOLARCHAIN_SVC_WORKER_RETRY_BACKOFF_SECONDS}
    }
    maxIngestRunSeconds = 900
    maxIngestRunSeconds = ${?SCHOLARCHAIN_SVC_WORKER_MAX_INGEST_RUN_SECONDS}
    idleBackoffMillis = 2000
    idleBackoffMillis = ${?SCHOLARCHAIN_SVC_WORKER_IDLE_BACKOFF_MILLIS}
    # must exceed waitSeconds + maxIngestRunSeconds (checked at start-up)
    pollStalenessSeconds = 1200
    pollStalenessSeconds = ${?SCHOLARCHAIN_SVC_WORKER_POLL_STALENESS_SECONDS}
    maxConsecutiveFailures = 5
    maxConsecutiveFailures = ${?SCHOLARCHAIN_SVC_WORKER_MAX_CONSECUTIVE_FAILURES}
    shutdownGraceSeconds = 60
    shutdownGraceSeconds = ${?SCHOLARCHAIN_SVC_WORKER_SHUTDOWN_GRACE_SECONDS}
  }
}

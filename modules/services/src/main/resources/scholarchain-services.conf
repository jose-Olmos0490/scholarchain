# ScholarChain services configuration (owner: service-engineer).
#
# Every value can be overridden by its environment variable. serving.runId and
# serving.snapshot have no value of their own: the deployment must set them.
# API keys are NOT configured here: they come from AWS Secrets Manager by
# secret name (auth.keySecretName).
scholarchain.services {
  http {
    maxBodyBytes = 65536
    maxBodyBytes = ${?SCHOLARCHAIN_SVC_MAX_BODY_BYTES}
    maxQuestionChars = 2000
    maxQuestionChars = ${?SCHOLARCHAIN_SVC_MAX_QUESTION_CHARS}
    maxListItems = 20
    maxListItems = ${?SCHOLARCHAIN_SVC_MAX_LIST_ITEMS}
    idempotencyKeyMinChars = 8
    idempotencyKeyMaxChars = 128
  }
  rateLimit {
    requestsPerWindow = 120
    requestsPerWindow = ${?SCHOLARCHAIN_SVC_RATE_LIMIT_REQUESTS}
    windowSeconds = 60
    windowSeconds = ${?SCHOLARCHAIN_SVC_RATE_LIMIT_WINDOW_SECONDS}
  }
  breaker {
    failureThreshold = 5
    failureThreshold = ${?SCHOLARCHAIN_SVC_BREAKER_FAILURES}
    openMillis = 30000
    openMillis = ${?SCHOLARCHAIN_SVC_BREAKER_OPEN_MILLIS}
  }
  retry {
    readRetries = 2
    readRetries = ${?SCHOLARCHAIN_SVC_READ_RETRIES}
    backoffMillis = 50
    backoffMillis = ${?SCHOLARCHAIN_SVC_RETRY_BACKOFF_MILLIS}
    readTimeoutMillis = 2000
    readTimeoutMillis = ${?SCHOLARCHAIN_SVC_READ_TIMEOUT_MILLIS}
  }
  serving {
    runId = ${?SCHOLARCHAIN_SVC_RUN_ID}
    snapshot = ${?SCHOLARCHAIN_SVC_SNAPSHOT}
  }
  execution {
    workerThreads = 8
    workerThreads = ${?SCHOLARCHAIN_SVC_WORKER_THREADS}
    queueCapacity = 32
    queueCapacity = ${?SCHOLARCHAIN_SVC_QUEUE_CAPACITY}
  }
  evidence {
    contentMaxChars = 600
    contentMaxChars = ${?SCHOLARCHAIN_SVC_EVIDENCE_CONTENT_MAX_CHARS}
  }
  graph {
    neighborMaxDepth = 1
    edgeTypes = ["COAUTHORED_WITH"]
  }
  ops {
    metricsEnabled = false
    metricsEnabled = ${?SCHOLARCHAIN_SVC_METRICS_ENABLED}
    readinessTimeoutMillis = 1000
    readinessTimeoutMillis = ${?SCHOLARCHAIN_SVC_READINESS_TIMEOUT_MILLIS}
  }
  auth {
    keySecretName = ${?SCHOLARCHAIN_SVC_KEY_SECRET_NAME}
  }
}

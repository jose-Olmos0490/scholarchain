# ScholarChain environment-variable layer (highest precedence).
# Owner: domain-engineer (modules/core).
#
# Every line binds one configuration key to one environment variable with an
# optional substitution. When the variable is unset the line has no effect and
# the value from the environment file (or reference.conf) is used. Set a
# variable to override any file value. This file contains no values.

scholarchain {
  config.schemaVersion = ${?SCHOLARCHAIN_CONFIG_SCHEMA_VERSION}

  application {
    name = ${?SCHOLARCHAIN_APPLICATION_NAME}
    awsRegion = ${?AWS_REGION}
    awsAccountId = ${?SCHOLARCHAIN_AWS_ACCOUNT_ID}
  }

  storage {
    rawBucket = ${?RAW_BUCKET}
    curatedBucket = ${?CURATED_BUCKET}
    graphBucket = ${?GRAPH_BUCKET}
    ragBucket = ${?RAG_BUCKET}
    vectorBucket = ${?VECTOR_BUCKET}
  }

  neptune {
    endpoint = ${?NEPTUNE_ENDPOINT}
    port = ${?NEPTUNE_PORT}
    queryTimeoutMs = ${?NEPTUNE_QUERY_TIMEOUT_MS}
    loaderRoleArn = ${?NEPTUNE_LOADER_ROLE_ARN}
  }

  vectorIndexes {
    researchers = ${?VECTOR_INDEX_RESEARCHERS}
    communities = ${?VECTOR_INDEX_COMMUNITIES}
    abstracts = ${?VECTOR_INDEX_ABSTRACTS}
    paths = ${?VECTOR_INDEX_PATHS}
    topicInstitutions = ${?VECTOR_INDEX_TOPIC_INSTITUTIONS}
  }

  datasets.dblpSubset {
    recordTypes = ${?DBLP_SUBSET_RECORD_TYPES}
    startYear = ${?DBLP_SUBSET_START_YEAR}
    endYear = ${?DBLP_SUBSET_END_YEAR}
    maxWorks = ${?DBLP_SUBSET_MAX_WORKS}
  }

  hadoop {
    numReducers = ${?SCHOLARCHAIN_HADOOP_NUM_REDUCERS}
    maxBlockSize = ${?SCHOLARCHAIN_HADOOP_MAX_BLOCK_SIZE}
    largeTeamThreshold = ${?SCHOLARCHAIN_HADOOP_LARGE_TEAM_THRESHOLD}
    maxPairExpansionTeamSize = ${?SCHOLARCHAIN_HADOOP_MAX_PAIR_EXPANSION_TEAM_SIZE}
    intermediateCodec = ${?SCHOLARCHAIN_HADOOP_INTERMEDIATE_CODEC}
    outputCodec = ${?SCHOLARCHAIN_HADOOP_OUTPUT_CODEC}
    dblpRecordTypes = ${?SCHOLARCHAIN_HADOOP_DBLP_RECORD_TYPES}
    yearFrom = ${?SCHOLARCHAIN_HADOOP_YEAR_FROM}
    yearTo = ${?SCHOLARCHAIN_HADOOP_YEAR_TO}
    dblpDtdPath = ${?SCHOLARCHAIN_HADOOP_DBLP_DTD_PATH}
  }

  graph {
    windows = ${?SCHOLARCHAIN_GRAPH_WINDOWS}
    coauthorPolicyVersion = ${?SCHOLARCHAIN_GRAPH_COAUTHOR_POLICY_VERSION}
    includeAllYearsWindow = ${?SCHOLARCHAIN_GRAPH_INCLUDE_ALL_YEARS_WINDOW}
    representativeWorkLimit = ${?SCHOLARCHAIN_GRAPH_REPRESENTATIVE_WORK_LIMIT}
    identity {
      version = ${?SCHOLARCHAIN_GRAPH_IDENTITY_VERSION}
      maxClusterSize = ${?SCHOLARCHAIN_GRAPH_IDENTITY_MAX_CLUSTER_SIZE}
    }
    components.maxIterations = ${?SCHOLARCHAIN_GRAPH_COMPONENTS_MAX_ITERATIONS}
    kcore.maxIterations = ${?SCHOLARCHAIN_GRAPH_KCORE_MAX_ITERATIONS}
    paths {
      maxDepth = ${?SCHOLARCHAIN_GRAPH_PATHS_MAX_DEPTH}
      benchmarkPairs = ${?SCHOLARCHAIN_GRAPH_PATHS_BENCHMARK_PAIRS}
      samplePairCount = ${?SCHOLARCHAIN_GRAPH_PATHS_SAMPLE_PAIR_COUNT}
      seed = ${?SCHOLARCHAIN_GRAPH_PATHS_SEED}
    }
    diameter {
      sampleSources = ${?SCHOLARCHAIN_GRAPH_DIAMETER_SAMPLE_SOURCES}
      seed = ${?SCHOLARCHAIN_GRAPH_DIAMETER_SEED}
      minComponentSize = ${?SCHOLARCHAIN_GRAPH_DIAMETER_MIN_COMPONENT_SIZE}
    }
    semanticFacts {
      topEntityLimit = ${?SCHOLARCHAIN_GRAPH_SEMANTIC_TOP_ENTITY_LIMIT}
      memberLimit = ${?SCHOLARCHAIN_GRAPH_SEMANTIC_MEMBER_LIMIT}
    }
  }

  spark {
    hadoopInputRoot = ${?SCHOLARCHAIN_SPARK_HADOOP_INPUT_ROOT}
    hadoopRunId = ${?SCHOLARCHAIN_SPARK_HADOOP_RUN_ID}
    matchDecisionsDir = ${?SCHOLARCHAIN_SPARK_MATCH_DECISIONS_DIR}
    outputRoot = ${?SCHOLARCHAIN_SPARK_OUTPUT_ROOT}
    shufflePartitions = ${?SCHOLARCHAIN_SPARK_SHUFFLE_PARTITIONS}
    checkpointDir = ${?SCHOLARCHAIN_SPARK_CHECKPOINT_DIR}
    checkpointInterval = ${?SCHOLARCHAIN_SPARK_CHECKPOINT_INTERVAL}
  }

  entityResolution {
    policyVersion = ${?SCHOLARCHAIN_ER_POLICY_VERSION}
    acceptThreshold = ${?SCHOLARCHAIN_ER_ACCEPT_THRESHOLD}
    rejectThreshold = ${?SCHOLARCHAIN_ER_REJECT_THRESHOLD}
    llmBandMin = ${?SCHOLARCHAIN_ER_LLM_BAND_MIN}
    llmBandMax = ${?SCHOLARCHAIN_ER_LLM_BAND_MAX}
  }

  bridge {
    algorithm = ${?SCHOLARCHAIN_BRIDGE_ALGORITHM}
    sampleSize = ${?SCHOLARCHAIN_BRIDGE_SAMPLE_SIZE}
    randomSeed = ${?SCHOLARCHAIN_BRIDGE_RANDOM_SEED}
  }

  community {
    algorithm = ${?SCHOLARCHAIN_COMMUNITY_ALGORITHM}
    maxIterations = ${?SCHOLARCHAIN_COMMUNITY_MAX_ITERATIONS}
  }

  retrieval {
    graphLimit = ${?SCHOLARCHAIN_RETRIEVAL_GRAPH_LIMIT}
    vectorLimit = ${?SCHOLARCHAIN_RETRIEVAL_VECTOR_LIMIT}
    maxPathDepth = ${?SCHOLARCHAIN_RETRIEVAL_MAX_PATH_DEPTH}
    contextTokenBudget = ${?SCHOLARCHAIN_RETRIEVAL_CONTEXT_TOKEN_BUDGET}
    fusionPolicyVersion = ${?SCHOLARCHAIN_RETRIEVAL_FUSION_POLICY_VERSION}
    pathResultLimit = ${?SCHOLARCHAIN_RETRIEVAL_PATH_RESULT_LIMIT}
    pathTimeoutMillis = ${?SCHOLARCHAIN_RETRIEVAL_PATH_TIMEOUT_MILLIS}
    evidenceMaxItems = ${?SCHOLARCHAIN_RETRIEVAL_EVIDENCE_MAX_ITEMS}
    coauthorPageSize = ${?SCHOLARCHAIN_RETRIEVAL_COAUTHOR_PAGE_SIZE}
  }

  rag {
    resolver {
      minConfidence = ${?SCHOLARCHAIN_RAG_RESOLVER_MIN_CONFIDENCE}
      minMargin = ${?SCHOLARCHAIN_RAG_RESOLVER_MIN_MARGIN}
      maxCandidates = ${?SCHOLARCHAIN_RAG_RESOLVER_MAX_CANDIDATES}
    }
    llm {
      maxRetries = ${?SCHOLARCHAIN_RAG_LLM_MAX_RETRIES}
      maxOutputTokens = ${?SCHOLARCHAIN_RAG_LLM_MAX_OUTPUT_TOKENS}
    }
    planner {
      promptVersion = ${?SCHOLARCHAIN_RAG_PLANNER_PROMPT_VERSION}
      schemaVersion = ${?SCHOLARCHAIN_RAG_PLANNER_SCHEMA_VERSION}
    }
  }

  llm {
    provider = ${?SCHOLARCHAIN_LLM_PROVIDER}
    anthropic {
      modelId = ${?SCHOLARCHAIN_ANTHROPIC_MODEL_ID}
      baseUrl = ${?SCHOLARCHAIN_ANTHROPIC_BASE_URL}
      apiVersion = ${?SCHOLARCHAIN_ANTHROPIC_VERSION}
      connectTimeoutMs = ${?SCHOLARCHAIN_ANTHROPIC_CONNECT_TIMEOUT_MS}
      requestTimeoutMs = ${?SCHOLARCHAIN_ANTHROPIC_REQUEST_TIMEOUT_MS}
      maxRetries = ${?SCHOLARCHAIN_ANTHROPIC_MAX_RETRIES}
    }
  }

  embedding {
    provider = ${?SCHOLARCHAIN_EMBEDDING_PROVIDER}
    voyage {
      modelId = ${?SCHOLARCHAIN_VOYAGE_MODEL_ID}
      baseUrl = ${?SCHOLARCHAIN_VOYAGE_BASE_URL}
      outputDimension = ${?SCHOLARCHAIN_VOYAGE_OUTPUT_DIMENSION}
      batchSize = ${?SCHOLARCHAIN_VOYAGE_BATCH_SIZE}
      connectTimeoutMs = ${?SCHOLARCHAIN_VOYAGE_CONNECT_TIMEOUT_MS}
      requestTimeoutMs = ${?SCHOLARCHAIN_VOYAGE_REQUEST_TIMEOUT_MS}
      maxRetries = ${?SCHOLARCHAIN_VOYAGE_MAX_RETRIES}
    }
  }

  models {
    embeddingModelId = ${?EMBEDDING_MODEL_ID}
    synthesisModelId = ${?SYNTHESIS_MODEL_ID}
    verificationModelId = ${?VERIFICATION_MODEL_ID}
  }

  operations {
    synchronousDeadlineMs = ${?SCHOLARCHAIN_OPS_SYNCHRONOUS_DEADLINE_MS}
    maxWorkflowRetries = ${?SCHOLARCHAIN_OPS_MAX_WORKFLOW_RETRIES}
    maxConcurrentLlmCalls = ${?SCHOLARCHAIN_OPS_MAX_CONCURRENT_LLM_CALLS}
  }

  dynamodb {
    tablePrefix = ${?SCHOLARCHAIN_DDB_TABLE_PREFIX}
    tables {
      runLedger = ${?SCHOLARCHAIN_DDB_TABLE_RUN_LEDGER}
      entityLinkCache = ${?SCHOLARCHAIN_DDB_TABLE_ENTITY_LINK_CACHE}
      querySession = ${?SCHOLARCHAIN_DDB_TABLE_QUERY_SESSION}
      evidenceBundle = ${?SCHOLARCHAIN_DDB_TABLE_EVIDENCE_BUNDLE}
      artifactRegistry = ${?SCHOLARCHAIN_DDB_TABLE_ARTIFACT_REGISTRY}
      researcherMetricCache = ${?SCHOLARCHAIN_DDB_TABLE_RESEARCHER_METRIC_CACHE}
    }
  }

  s3Prefixes {
    reports = ${?SCHOLARCHAIN_S3_PREFIX_REPORTS}
    logs = ${?SCHOLARCHAIN_S3_PREFIX_LOGS}
    neptuneExport = ${?SCHOLARCHAIN_S3_PREFIX_NEPTUNE_EXPORT}
  }

  batch {
    putVectors = ${?SCHOLARCHAIN_STORAGE_PUT_VECTORS_BATCH_SIZE}
    getVectors = ${?SCHOLARCHAIN_STORAGE_GET_VECTORS_BATCH_SIZE}
    dynamoBatchWrite = ${?SCHOLARCHAIN_STORAGE_DYNAMODB_BATCH_WRITE_SIZE}
    neptuneLoaderParallelism = ${?SCHOLARCHAIN_NEPTUNE_LOADER_PARALLELISM}
  }

  retry {
    maxAttempts = ${?SCHOLARCHAIN_STORAGE_RETRY_MAX_ATTEMPTS}
    baseDelayMs = ${?SCHOLARCHAIN_STORAGE_RETRY_BASE_DELAY_MS}
    maxDelayMs = ${?SCHOLARCHAIN_STORAGE_RETRY_MAX_DELAY_MS}
  }

  vectorIndexSettings {
    researchers {
      dimension = ${?SCHOLARCHAIN_VECTOR_INDEX_RESEARCHERS_DIMENSION}
      distanceMetric = ${?SCHOLARCHAIN_VECTOR_INDEX_RESEARCHERS_DISTANCE_METRIC}
      indexType = ${?SCHOLARCHAIN_VECTOR_INDEX_RESEARCHERS_TYPE}
    }
    communities {
      dimension = ${?SCHOLARCHAIN_VECTOR_INDEX_COMMUNITIES_DIMENSION}
      distanceMetric = ${?SCHOLARCHAIN_VECTOR_INDEX_COMMUNITIES_DISTANCE_METRIC}
      indexType = ${?SCHOLARCHAIN_VECTOR_INDEX_COMMUNITIES_TYPE}
    }
    abstracts {
      dimension = ${?SCHOLARCHAIN_VECTOR_INDEX_ABSTRACTS_DIMENSION}
      distanceMetric = ${?SCHOLARCHAIN_VECTOR_INDEX_ABSTRACTS_DISTANCE_METRIC}
      indexType = ${?SCHOLARCHAIN_VECTOR_INDEX_ABSTRACTS_TYPE}
    }
    paths {
      dimension = ${?SCHOLARCHAIN_VECTOR_INDEX_PATHS_DIMENSION}
      distanceMetric = ${?SCHOLARCHAIN_VECTOR_INDEX_PATHS_DISTANCE_METRIC}
      indexType = ${?SCHOLARCHAIN_VECTOR_INDEX_PATHS_TYPE}
    }
    topicInstitutions {
      dimension = ${?SCHOLARCHAIN_VECTOR_INDEX_TOPIC_INSTITUTIONS_DIMENSION}
      distanceMetric = ${?SCHOLARCHAIN_VECTOR_INDEX_TOPIC_INSTITUTIONS_DISTANCE_METRIC}
      indexType = ${?SCHOLARCHAIN_VECTOR_INDEX_TOPIC_INSTITUTIONS_TYPE}
    }
  }

  querySession.ttlDays = ${?SCHOLARCHAIN_QUERY_SESSION_TTL_DAYS}

  endpoints {
    s3 = ${?SCHOLARCHAIN_ENDPOINT_S3}
    dynamodb = ${?SCHOLARCHAIN_ENDPOINT_DYNAMODB}
    s3Vectors = ${?SCHOLARCHAIN_ENDPOINT_S3_VECTORS}
  }

  integration.awsProfileVariable = ${?SCHOLARCHAIN_IT_AWS_PROFILE_VARIABLE}
}

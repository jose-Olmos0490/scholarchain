# ScholarChain base configuration (lowest-precedence layer).
# Owner: domain-engineer (modules/core).
#
# Precedence, highest first:
#   1. environment variables, via ${?VAR} in scholarchain/env-overrides.conf
#   2. versioned environment file scholarchain/conf/<SCHOLARCHAIN_ENV>.conf
#      (optional: a missing file is an empty layer)
#   3. this file
#
# SCHOLARCHAIN_ENV is always required. Only the variables bound in
# env-overrides.conf (plus SCHOLARCHAIN_ENV) are read from the environment.
#
# Functional-run values for the DBLP subset and the analysis windows live in the
# versioned environment file scholarchain/conf/dev.conf, never here or in code.
#
# This file holds non-secret structure only. It deliberately gives NO value to
# bucket names, endpoints, ports, account IDs, Regions, model IDs, thresholds,
# graph or dataset windows, bridge/community algorithm parameters, retrieval
# limits or policy versions. Every such key is required, and loading fails with
# a typed error that lists each missing key and its environment variable.
#
# One documented exception: the scholarchain.hadoop defaults below were fixed
# by the human-authored Phase 04 work order A (maxBlockSize 200,
# largeTeamThreshold 50, maxPairExpansionTeamSize 2000; codecs that work
# without native libraries, final output gzip). Each can be overridden by its
# environment variable or an environment file. hadoop.dblpRecordTypes,
# hadoop.yearFrom and hadoop.yearTo have no value of their own: when unset, the
# loader uses datasets.dblpSubset.recordTypes/startYear/endYear (the manifest
# subset rule). When set, they may only narrow that subset.
#
# Required keys (environment variable in brackets):
#   application.awsRegion                  [AWS_REGION]
#   application.awsAccountId               [SCHOLARCHAIN_AWS_ACCOUNT_ID]
#   storage.rawBucket                      [RAW_BUCKET]
#   storage.curatedBucket                  [CURATED_BUCKET]
#   storage.graphBucket                    [GRAPH_BUCKET]
#   storage.ragBucket                      [RAG_BUCKET]
#   storage.vectorBucket                   [VECTOR_BUCKET]
#   neptune.endpoint                       [NEPTUNE_ENDPOINT]
#   neptune.port                           [NEPTUNE_PORT]
#   neptune.queryTimeoutMs                 [NEPTUNE_QUERY_TIMEOUT_MS]
#   vectorIndexes.researchers              [VECTOR_INDEX_RESEARCHERS]
#   vectorIndexes.communities              [VECTOR_INDEX_COMMUNITIES]
#   vectorIndexes.abstracts                [VECTOR_INDEX_ABSTRACTS]
#   vectorIndexes.paths                    [VECTOR_INDEX_PATHS]
#   vectorIndexes.topicInstitutions        [VECTOR_INDEX_TOPIC_INSTITUTIONS]
#   datasets.dblpSubset.recordTypes ("a,b") [DBLP_SUBSET_RECORD_TYPES]
#   datasets.dblpSubset.startYear          [DBLP_SUBSET_START_YEAR]
#   datasets.dblpSubset.endYear            [DBLP_SUBSET_END_YEAR]
#   datasets.dblpSubset.maxWorks (> 0)     [DBLP_SUBSET_MAX_WORKS]
#   hadoop.numReducers (>= 1)              [SCHOLARCHAIN_HADOOP_NUM_REDUCERS]
#   hadoop.dblpDtdPath (*.dtd, not http)   [SCHOLARCHAIN_HADOOP_DBLP_DTD_PATH]
#
# Keys with a default (environment variable in brackets):
#   hadoop.maxBlockSize = 200 (>= 2)        [SCHOLARCHAIN_HADOOP_MAX_BLOCK_SIZE]
#   hadoop.largeTeamThreshold = 50 (>= 1)   [SCHOLARCHAIN_HADOOP_LARGE_TEAM_THRESHOLD]
#   hadoop.maxPairExpansionTeamSize = 2000  [SCHOLARCHAIN_HADOOP_MAX_PAIR_EXPANSION_TEAM_SIZE]
#     (>= 2 and >= largeTeamThreshold)
#   hadoop.intermediateCodec = DefaultCodec [SCHOLARCHAIN_HADOOP_INTERMEDIATE_CODEC]
#   hadoop.outputCodec = GzipCodec          [SCHOLARCHAIN_HADOOP_OUTPUT_CODEC]
#
# Optional narrowing overrides (when unset, the datasets.dblpSubset value is used):
#   hadoop.dblpRecordTypes ("a,b")          [SCHOLARCHAIN_HADOOP_DBLP_RECORD_TYPES]
#     (DBLP record elements, a subset of datasets.dblpSubset.recordTypes)
#   hadoop.yearFrom                         [SCHOLARCHAIN_HADOOP_YEAR_FROM]
#   hadoop.yearTo                           [SCHOLARCHAIN_HADOOP_YEAR_TO]
#     (yearFrom <= yearTo, inside the DBLP subset years)
#
# Remaining required keys:
#   graph.windows ("YYYY-YYYY,...")        [SCHOLARCHAIN_GRAPH_WINDOWS]
#     (sorted, non-overlapping, each inside the DBLP subset years)
#   graph.coauthorPolicyVersion            [SCHOLARCHAIN_GRAPH_COAUTHOR_POLICY_VERSION]
#   entityResolution.policyVersion         [SCHOLARCHAIN_ER_POLICY_VERSION]
#   entityResolution.acceptThreshold       [SCHOLARCHAIN_ER_ACCEPT_THRESHOLD]
#   entityResolution.rejectThreshold       [SCHOLARCHAIN_ER_REJECT_THRESHOLD]
#   entityResolution.llmBandMin            [SCHOLARCHAIN_ER_LLM_BAND_MIN]
#   entityResolution.llmBandMax            [SCHOLARCHAIN_ER_LLM_BAND_MAX]
#   bridge.algorithm                       [SCHOLARCHAIN_BRIDGE_ALGORITHM]
#   bridge.sampleSize                      [SCHOLARCHAIN_BRIDGE_SAMPLE_SIZE]
#   bridge.randomSeed                      [SCHOLARCHAIN_BRIDGE_RANDOM_SEED]
#   community.algorithm                    [SCHOLARCHAIN_COMMUNITY_ALGORITHM]
#   community.maxIterations                [SCHOLARCHAIN_COMMUNITY_MAX_ITERATIONS]
#   retrieval.graphLimit                   [SCHOLARCHAIN_RETRIEVAL_GRAPH_LIMIT]
#   retrieval.vectorLimit                  [SCHOLARCHAIN_RETRIEVAL_VECTOR_LIMIT]
#   retrieval.maxPathDepth                 [SCHOLARCHAIN_RETRIEVAL_MAX_PATH_DEPTH]
#   retrieval.contextTokenBudget           [SCHOLARCHAIN_RETRIEVAL_CONTEXT_TOKEN_BUDGET]
#   retrieval.fusionPolicyVersion          [SCHOLARCHAIN_RETRIEVAL_FUSION_POLICY_VERSION]
#   models.embeddingModelId                [EMBEDDING_MODEL_ID]
#   models.synthesisModelId                [SYNTHESIS_MODEL_ID]
#   models.verificationModelId             [VERIFICATION_MODEL_ID]
#   operations.synchronousDeadlineMs       [SCHOLARCHAIN_OPS_SYNCHRONOUS_DEADLINE_MS]
#   operations.maxWorkflowRetries          [SCHOLARCHAIN_OPS_MAX_WORKFLOW_RETRIES]
#   operations.maxConcurrentLlmCalls       [SCHOLARCHAIN_OPS_MAX_CONCURRENT_LLM_CALLS]
#
# Spark graph analytics (Phase 06 repair 01). All required, no shipped value;
# local values come from environment variables. Rules in brackets after the
# variable.
#   graph.includeAllYearsWindow            [SCHOLARCHAIN_GRAPH_INCLUDE_ALL_YEARS_WINDOW]
#     (true|false; when true an all-years window spanning the DBLP subset years
#      is added outside the non-overlap rule; works with no year belong only to
#      it; a fixed window equal to it is rejected)
#   graph.representativeWorkLimit (K)      [SCHOLARCHAIN_GRAPH_REPRESENTATIVE_WORK_LIMIT] (>= 1)
#   graph.identity.version                 [SCHOLARCHAIN_GRAPH_IDENTITY_VERSION] (v<N>)
#   graph.identity.maxClusterSize          [SCHOLARCHAIN_GRAPH_IDENTITY_MAX_CLUSTER_SIZE] (>= 1;
#     a larger identity cluster is not merged)
#   graph.components.maxIterations         [SCHOLARCHAIN_GRAPH_COMPONENTS_MAX_ITERATIONS] (>= 1)
#   graph.kcore.maxIterations              [SCHOLARCHAIN_GRAPH_KCORE_MAX_ITERATIONS] (>= 1)
#   graph.paths.maxDepth                   [SCHOLARCHAIN_GRAPH_PATHS_MAX_DEPTH] (>= 1)
#   graph.paths.samplePairCount            [SCHOLARCHAIN_GRAPH_PATHS_SAMPLE_PAIR_COUNT] (>= 1)
#   graph.paths.seed                       [SCHOLARCHAIN_GRAPH_PATHS_SEED] (integer)
#   graph.diameter.sampleSources           [SCHOLARCHAIN_GRAPH_DIAMETER_SAMPLE_SOURCES] (>= 1)
#   graph.diameter.seed                    [SCHOLARCHAIN_GRAPH_DIAMETER_SEED] (integer)
#   graph.diameter.minComponentSize        [SCHOLARCHAIN_GRAPH_DIAMETER_MIN_COMPONENT_SIZE] (>= 2)
#   graph.semanticFacts.topEntityLimit     [SCHOLARCHAIN_GRAPH_SEMANTIC_TOP_ENTITY_LIMIT] (>= 1)
#   graph.semanticFacts.memberLimit        [SCHOLARCHAIN_GRAPH_SEMANTIC_MEMBER_LIMIT] (>= 1)
#   spark.hadoopInputRoot                  [SCHOLARCHAIN_SPARK_HADOOP_INPUT_ROOT]
#   spark.matchDecisionsDir                [SCHOLARCHAIN_SPARK_MATCH_DECISIONS_DIR]
#   spark.outputRoot                       [SCHOLARCHAIN_SPARK_OUTPUT_ROOT]
#     (differs from both inputs)
#   spark.shufflePartitions                [SCHOLARCHAIN_SPARK_SHUFFLE_PARTITIONS] (>= 1)
#   spark.checkpointDir                    [SCHOLARCHAIN_SPARK_CHECKPOINT_DIR]
#     (differs from outputRoot)
#   spark.checkpointInterval               [SCHOLARCHAIN_SPARK_CHECKPOINT_INTERVAL] (>= 1)
#   (spark.* locations: file path or object-store URI, never an http(s) URL)
#
# Optional keys (absent or blank means "not set"):
#   spark.hadoopRunId                      [SCHOLARCHAIN_SPARK_HADOOP_RUN_ID] (run:<64 hex>)
#   graph.paths.benchmarkPairs             [SCHOLARCHAIN_GRAPH_PATHS_BENCHMARK_PAIRS]
#     ("src|dst,src|dst" researcher stable IDs; no self-pair, no repeated
#      unordered pair; when empty, samplePairCount pairs are sampled with seed)
#
# Reused by Spark: community.maxIterations (label propagation),
# bridge.sampleSize and bridge.randomSeed (approximate betweenness k and seed).

scholarchain {
  # Configuration file format version. Not environment-specific.
  config {
    schemaVersion = "config-v1"
  }

  application {
    # Logical application name used in logs and metric namespaces.
    name = "scholarchain"
  }

  storage {}
  neptune {}
  vectorIndexes {}
  datasets {
    dblpSubset {}
  }
  hadoop {
    # Human-approved defaults (Phase 04 work order A).
    maxBlockSize = 200
    largeTeamThreshold = 50
    maxPairExpansionTeamSize = 2000
    # Both codecs work without Hadoop native libraries (Java zlib fallback).
    intermediateCodec = "org.apache.hadoop.io.compress.DefaultCodec"
    outputCodec = "org.apache.hadoop.io.compress.GzipCodec"
    # dblpRecordTypes, yearFrom and yearTo are deliberately unset: when unset,
    # the loader uses datasets.dblpSubset.* (the manifest subset rule).
  }
  graph {}
  entityResolution {}
  bridge {}
  community {}
  retrieval {}
  models {}
  operations {}
  spark {}
}

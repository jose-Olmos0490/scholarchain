# Experiment A. Format: scripts/run-experiment.sh (name, runner, target, limits, args, metrics).
# That script also reads approval, blocked, preconditions and environment (approval gate). Other
# keys are ignored by it and read by load-tests/ and experiments/bin/.
# A human must approve this file (approval block) and commit it before it runs.
# To approve, the human (only) sets approval.status: APPROVED, approval.approved_by: their name,
# approval.approved_on: 'YYYY-MM-DD', then commits. `blocked` must be the boolean false.
# scripts/run-experiment.sh refuses an unapproved or blocked manifest for runner: pipeline too.
# NOT GATED: running scripts/run-bounded-pipeline.sh directly reads no manifest, so neither
# approval nor `blocked` applies there (owner of that script: infra-engineer).
id: A
name: A-emr-baseline
priority: 4
purpose: 'Hadoop and Spark baseline on the bounded corpus at minimum EMR capacity: duration, capacity over time,
  failures, cost.'
approval:
  status: PENDING_HUMAN_APPROVAL
  approved_by: null
  approved_on: null
blocked: false
region: us-east-2
environment: dev
commit_sha: FILLED_AT_RUN_TIME (run record field commitSha)
identity:
  iam_user: CS441_Dev
  aws_profile: cs441
  risk: 'known least-privilege risk, accepted by human ruling (phase 15): experiments run as IAM user CS441_Dev and no
    dedicated experiment role is created. The permissions of that user are not verified in this repository'
dataset_snapshot:
  dblp: '2026-11-01'
  openalex: '2026-10-14'
  orcid: '2026-10-13'
  crossref: UNDETERMINED (dataset-manifest.yaml holds ${RETRIEVAL_DATE})
  raw_bucket_contents: 'UNDETERMINED: no record shows what is staged under the cloud raw bucket'
  source: datasets/dataset-manifest.yaml
runner: pipeline
args: []
limits:
  max_duration_seconds: 7200
  emr_max_nodes: 4
resource_bounds:
  emr:
    primary_nodes: 1
    initial_core_nodes: 2
    managed_scaling_unit_type: Instances
    managed_scaling_min_units: 2
    managed_scaling_max_units: 4
    max_core_units: 4
    instance_type: m5.xlarge
    idle_timeout_seconds: 3600
    step_timeout_seconds: 7200
    enable_emr_default: false
    source: infra/terraform/environments/dev/variables.tf:92,170-188; infra/terraform/modules/emr/variables.tf:55-91;
      infra/terraform/modules/emr/main.tf:126-129; infra/terraform/modules/pipeline/variables.tf:25
  emr_max_nodes_note: 4 managed-scaling instance units (core and task) plus 1 primary node
cost_estimate_usd:
  incremental: 1.2
  worst_case: 3.6
cost_cap_usd: 4.0
stop_conditions:
- 7200 s hard timeout by run-experiment.sh (inner wait 6900 s stops the Step Functions execution)
- 7200 s per-step timeout in the state machine; no retry
preconditions:
- human applies Terraform with enable_emr=true (human-only)
- raw input staged and its snapshot recorded
- entity-resolution match decisions present for the Spark step
- required pipeline_environment keys set
collect:
  pre_seconds: 300
  post_seconds: 3900
  deployed_services: []
metrics:
- id: emr_nodes_total_requested
  namespace: AWS/ElasticMapReduce
  metric: TotalNodesRequested
  stat: Maximum
  dimensionsFrom:
    JobFlowId: SC_EMR_CLUSTER_ID
- id: emr_nodes_total_running
  namespace: AWS/ElasticMapReduce
  metric: TotalNodesRunning
  stat: Maximum
  dimensionsFrom:
    JobFlowId: SC_EMR_CLUSTER_ID
- id: emr_nodes_core_requested
  namespace: AWS/ElasticMapReduce
  metric: CoreNodesRequested
  stat: Maximum
  dimensionsFrom:
    JobFlowId: SC_EMR_CLUSTER_ID
- id: emr_nodes_core_running
  namespace: AWS/ElasticMapReduce
  metric: CoreNodesRunning
  stat: Maximum
  dimensionsFrom:
    JobFlowId: SC_EMR_CLUSTER_ID
- id: emr_nodes_task_requested
  namespace: AWS/ElasticMapReduce
  metric: TaskNodesRequested
  stat: Maximum
  dimensionsFrom:
    JobFlowId: SC_EMR_CLUSTER_ID
- id: emr_nodes_task_running
  namespace: AWS/ElasticMapReduce
  metric: TaskNodesRunning
  stat: Maximum
  dimensionsFrom:
    JobFlowId: SC_EMR_CLUSTER_ID
- id: emr_load_pending_ratio
  namespace: AWS/ElasticMapReduce
  metric: ContainerPendingRatio
  stat: Average
  dimensionsFrom:
    JobFlowId: SC_EMR_CLUSTER_ID
- id: emr_load_yarn_mem_available_pct
  namespace: AWS/ElasticMapReduce
  metric: YARNMemoryAvailablePercentage
  stat: Average
  dimensionsFrom:
    JobFlowId: SC_EMR_CLUSTER_ID
- id: emr_load_apps_running
  namespace: AWS/ElasticMapReduce
  metric: AppsRunning
  stat: Average
  dimensionsFrom:
    JobFlowId: SC_EMR_CLUSTER_ID
- id: emr_load_apps_pending
  namespace: AWS/ElasticMapReduce
  metric: AppsPending
  stat: Average
  dimensionsFrom:
    JobFlowId: SC_EMR_CLUSTER_ID

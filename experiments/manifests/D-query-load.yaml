# Experiment D. Format: scripts/run-experiment.sh (name, runner, target, limits, args, metrics).
# Other keys are ignored by that script and read by load-tests/ and experiments/bin/.
# A human must approve this file (approval block) and commit it before it runs.
# To approve, the human (only) sets approval.status: APPROVED, approval.approved_by: their name,
# approval.approved_on: 'YYYY-MM-DD', then commits. `blocked` must be the boolean false.
# The load tools refuse to run otherwise, through run-experiment.sh or invoked directly.
id: D
name: D-query-load
priority: 3
purpose: 'Query load at 1, 5, 10 and 20 concurrent clients: latency, throughput, error rate, ECS tasks and CPU.'
approval:
  status: PENDING_HUMAN_APPROVAL
  approved_by: null
  approved_on: null
blocked: false
region: us-east-2
environment: dev
commit_sha: FILLED_AT_RUN_TIME (run record field commitSha)
dataset_snapshot:
  dataset: dblp
  date: '2026-11-01'
  label: dblp Monthly Snapshot XML Release of November 2026
  serving_run_id: run:f6023de34a312366583b3eacbc2b2a689234cf1abe79e184fb66875bac297a60
  scope: bounded sample-derived run loaded in phase 14/14b (89 researcher rows); current store contents are unverified
  source: phase-14 and phase-14b records (phase-14b/load-live.log), datasets/dataset-manifest.yaml
runner: load-test
target: query_load.py
args:
- --manifest
- experiments/manifests/D-query-load.yaml
limits:
  max_duration_seconds: 2400
  ecs_max_tasks: 3
resource_bounds:
  services:
    query-api:
      min_tasks: 1
      max_tasks: 3
      cpu_units: 1024
      memory_mib: 2048
      source: infra/terraform/environments/dev/variables.tf:210-216
    graph-evidence-api:
      min_tasks: 1
      max_tasks: 2
      cpu_units: 512
      memory_mib: 1024
      source: infra/terraform/environments/dev/variables.tf:217-223
    embedding-worker:
      min_tasks: 0
      max_tasks: 2
      cpu_units: 512
      memory_mib: 1024
      source: infra/terraform/environments/dev/variables.tf:224-230
    caveat: repository defaults; the git-ignored terraform.tfvars may override them and was not read
  api_cpu_target_percent:
    value: 60
    source: infra/terraform/modules/compute/variables.tf:92-95
  neptune:
    min_ncu: 1
    max_ncu: 4
    source: infra/terraform/environments/dev/variables.tf:145-153
  api_rate_limit:
    requests: 120
    window_seconds: 60
    scope: per principal, per task
    source: modules/services/src/main/resources/scholarchain-services.conf (rateLimit)
cost_estimate_usd:
  incremental: 9.0
  note: dominated by synthesis-model tokens; model and price unverified
cost_cap_usd: 15.0
known_limitation: Pacing at 110 requests per minute keeps below the 120 per minute per key per task API limit, so
  in-flight requests are about rate times latency and may never reach 10 or 20. The achieved value is recorded per
  request (inFlightAtStart).
stop_conditions:
- hard request cap 250
- no preflight request returns a non-abstained 200 (PREFLIGHT_NO_ANSWER)
- 3 consecutive 401/403 (AUTH_FAILURES)
- over 50% 5xx or transport errors in the last 20 requests (ERROR_RATE)
- over 50% 429 in the last 20 requests (RATE_LIMITED)
- '360 s per level: the level is recorded as incomplete and the next level still runs'
- 2100 s of load (LOAD_TIME_CAP), 2400 s hard timeout by run-experiment.sh
- 'estimated spend would pass cost_cap_usd (COST_CAP_REACHED): requests sent x load.estimated_usd_per_request,
  an estimate and not a bill'
preconditions:
- 'human decision (phase 15 review, finding 21): plain HTTP to the dev load balancer is accepted for this experiment
  only; set SC_ALLOW_PLAINTEXT_HTTP=1'
- 'SCHOLARCHAIN_API_TOKEN holds a dedicated short-lived API token issued for these experiment runs only'
- 'the human revokes that token after the runs'
load:
  kind: levels
  question_set: load-tests/questions/query-v1.json
  levels:
  - 1
  - 5
  - 10
  - 20
  requests_per_level: 60
  max_total_requests: 250
  max_requests_per_minute: 110
  # cost_estimate_usd.incremental 9.0 / 250 requests; model and price unverified
  estimated_usd_per_request: 0.036
  request_timeout_seconds: 45
  level_max_seconds: 360
  max_load_seconds: 2100
  cooldown_seconds: 60
  request_limits:
    graphLimit: 5
    vectorLimit: 4
  stop:
    max_consecutive_auth_failures: 3
    error_rate_min_samples: 20
    max_error_rate: 0.5
    max_rate_limited_rate: 0.5
    require_answered_preflight: true
collect:
  pre_seconds: 300
  post_seconds: 1200
  deployed_services:
  - query-api
  - graph-evidence-api
  - embedding-worker
  logs:
  - kind: workflow_stages
    logGroupFrom: SC_QUERY_API_LOG_GROUP
metrics:
- id: tasks_desired_query_api
  namespace: ECS/ContainerInsights
  metric: DesiredTaskCount
  stat: Average
  dimensions:
    ServiceName: query-api
  dimensionsFrom:
    ClusterName: SC_ECS_CLUSTER
- id: tasks_running_query_api
  namespace: ECS/ContainerInsights
  metric: RunningTaskCount
  stat: Average
  dimensions:
    ServiceName: query-api
  dimensionsFrom:
    ClusterName: SC_ECS_CLUSTER
- id: tasks_pending_query_api
  namespace: ECS/ContainerInsights
  metric: PendingTaskCount
  stat: Average
  dimensions:
    ServiceName: query-api
  dimensionsFrom:
    ClusterName: SC_ECS_CLUSTER
- id: cpu_query_api
  namespace: AWS/ECS
  metric: CPUUtilization
  stat: Average
  dimensions:
    ServiceName: query-api
  dimensionsFrom:
    ClusterName: SC_ECS_CLUSTER

        billing: "Requester Pays. Crossref bulk-downloads documentation (checked 2026-11-20T02:38:55Z): 'rather than the bucket owner (Crossref) paying for bandwidth and transfer costs when downloading objects, the requester pays instead'; '--request-payer requester is mandatory'. Needs an authenticated AWS account and a human-approved cost."
        stated_size: "208 GB compressed, metadata for 180 million records"
        snapshot_date: null
        object_bytes: null
        publisher_checksum: null
        encoding: null
        item_schema: null
    license:
      id: "Bibliographic metadata: facts, not subject to copyright; Crossref-generated data: CC0-1.0; abstracts: publisher or author copyright"
      url: "https://www.crossref.org/documentation/retrieve-metadata/"
      notes: >-
        Crossref states that almost all metadata is reusable without
        restriction except abstracts, which keep the publisher or author
        license. The same statement covers REST API output and the Public
        Data File. Samples and API-route raw files drop the 'abstract' field.
        Pipelines must not redistribute abstracts.
    snapshot:
      date: "${RETRIEVAL_DATE}"
      label: >-
        REST API route: Crossref metadata is live, so the snapshot of record
        is the UTC date of <out>/RETRIEVED_AT (the latest batch retrieval
        time; per-batch times are in the .meta files and the span in
        <out>/RETRIEVAL_WINDOW), written by download.sh and recorded in the
        run manifest.
        The committed sample reflects API state at 2026-11-20T02:06:32Z.
      sample_retrieval_date: "2026-11-20"
    retrieval:
      script: "datasets/scripts/download.sh"
      command: "SCHOLARCHAIN_ALLOW_FULL_DOWNLOAD=1 datasets/scripts/download.sh --full --dataset crossref --out <local-dir> --doi-list <dblp-subset-dois.txt> [--max-dois N]"
      alternative_command: "datasets/scripts/download.sh --full --dataset crossref --out <dir> --crossref-route requester-pays   # prints the documented bulk alternative and exits 3; performs no transfer"
      sample_command: "datasets/scripts/download.sh --dataset crossref"
      dry_run_command: "datasets/scripts/download.sh --dataset crossref --dry-run"
    full_retrieval:
      api_batch_size: 10                # DOIs per filter=doi:... request (10 per request observed working in Phase 03)
      max_response_bytes: 8388608       # per-response byte cap, enforced during the transfer (head -c) and passed to curl --max-filesize
      request_interval_seconds: 1       # pause between requests
      request_max_time_seconds: 120     # curl --max-time per request
      input: "--doi-list: DOIs of the selected DBLP subset (Hadoop DBLP output for the same run); lower-cased, de-duplicated, sorted; optional --max-dois cap"
      output: >-
        <out>/CROSSREF_RUN (doi_list_sha256, doi_count, batch_size, api_url)
        and <out>/DOI_LIST.txt (the normalised list); per batch
        <out>/crossref-api-batch-NNNNNN.jsonl (one works item per line,
        abstract dropped), .jsonl.sha256, and .meta (doi_set_sha256,
        doi_count, retrieved_at); <out>/RETRIEVED_AT (latest batch
        retrieved_at) and <out>/RETRIEVAL_WINDOW (first and last
        retrieved_at, batch count).
      batch_identity: >-
        An <out> is bound to one normalised DOI list and batch size by
        CROSSREF_RUN. A non-empty <out> whose CROSSREF_RUN names a different
        DOI-list sha256 or batch size, or that has no CROSSREF_RUN, is
        refused before any request; the refusal names both hashes (review
        finding 2: a different list was otherwise skipped silently).
      idempotency: >-
        A batch is skipped only when its .jsonl.sha256 verifies, its .meta
        doi_set_sha256 equals the sha256 of the batch's DOIs, and every item
        DOI belongs to that batch; otherwise it is fetched again.
      provenance_dates: >-
        Each batch records its own retrieved_at. RETRIEVED_AT is recomputed at
        the end of every run as the latest batch retrieved_at, so a resumed
        run on a later date updates it; a run that fetches nothing leaves it
        unchanged.
    format:
      file_format: "JSON Lines written from REST API responses (message.items, one works item per line)"
      compression: "none as written by download.sh (gzip may be applied when staged to S3)"
      encoding: "UTF-8"
      item_schema: "Crossref REST API works item, message-version 1.0.0"
    size:
      expected:
        api_route: "one works item per DOI of the DBLP subset that Crossref knows; committed sample: 10 items, 47,915 bytes (about 4.8 KB per item, abstracts removed)"
        bulk_alternative_stated: "208 GB compressed, metadata for 180 million records"
        source: "committed sample (local observation) and https://www.crossref.org/services/metadata-retrieval/public-data-file/"
      observed:
        remote_bytes: null
        method: "API route: no fixed remote object; volume depends on the DBLP subset DOI list. Bulk alternative: no byte-exact size observed."
        local_bytes: null
    s3_raw_prefix: "s3://${RAW_BUCKET}/crossref/snapshot=${RETRIEVAL_DATE}/"
    integrity:
      policy: >-
        API route: every response must be HTTP 200 with status 'ok' and
        message-type 'work-list' (sample_tools.py crossref-jsonl exits
        otherwise), stay under max_response_bytes during the transfer, and
        each written batch gets a SHA-256 file and a .meta with its DOI-set
        hash; the batch set is immutable once staged under the snapshot
        prefix. Bulk alternative (not implemented): record the
        S3 object size and ETag, gzip -t every file, compute SHA-256 at
        ingest.
      publisher_checksum: "not applicable to the REST API route (responses carry no published checksum); see source.alternative_bulk.publisher_checksum for the bulk file"
      sha256: "per batch file, written by download.sh as <batch>.jsonl.sha256 at retrieval time"
    schema_version:
      source_schema: "Crossref REST API works item JSON, message-version 1.0.0"
      raw_schema_id: "crossref-api-jsonl/v1.0.0"
    subset_rule:
      functional_run: >-
        Exactly the DOIs found in the selected DBLP subset (dblp subset_rule,
        DOIs taken from https://doi.org/ <ee> links), lower-cased and
        de-duplicated; one Crossref works item per DOI that Crossref
        resolves. No title or name search is used.
      sample: "See samples[].subset_rule."
    linkage_fields:
      - DOI
      - title
      - author.given
      - author.family
      - author.sequence
      - author.ORCID
      - author.affiliation        # name and, when supplied, ROR id
      - issued
      - container-title
      - event.name
      - ISSN
      - ISBN
      - reference.DOI
    update_strategy: >-
      API route: re-query the DOI list of a new DBLP subset (or the changed
      DOIs) under a new snapshot=${RETRIEVAL_DATE} prefix; the REST API
      from-update-date / from-index-date filters support incremental
      refresh. Bulk alternative: annual Public Data File, pinned per run.
    privacy_notes:
      - "Contributor names, ORCID iDs and affiliations as deposited by members."
      - "Abstracts are copyrighted and excluded from samples and from any redistributed output."
      - "Optional CROSSREF_MAILTO contact is sent only when a human sets it; it has no default and is never committed."
    limitations:
      - "A matching author name is not sufficient evidence of author identity."
      - "Metadata completeness varies by member; many records lack ORCID, affiliation or references."
      - "API results are live state; two runs on different dates can differ. Record RETRIEVED_AT with every run."
      - "Only DOIs registered with Crossref are covered; DataCite and other registrars are absent."
      - "Works without a DOI in dblp cannot be retrieved by this route."
      - "Observed rate-limit headers on 2026-11-20 for a single-DOI request: x-rate-limit-limit 5, x-rate-limit-interval 1s, x-api-pool public-single. Limits may change; respect the headers."
    validation_commands:
      - "(cd <out> && sha256sum -c crossref-api-batch-*.jsonl.sha256)"
      - "(cd <out> && grep doi_list_sha256 CROSSREF_RUN && sha256sum DOI_LIST.txt)   # the two hashes must be equal"
      - "python3 -I -c 'import json,sys; [json.loads(l) for l in open(sys.argv[1])]' <out>/crossref-api-batch-000000.jsonl"
      - "datasets/scripts/validate-samples.sh"
    sampling:
      api_works_url: "https://api.crossref.org/works"
      linked_doi_count: 10
      output: "crossref/crossref-works-api-linked.jsonl"
    samples:
      - path: "crossref/crossref-works-api-linked.jsonl"

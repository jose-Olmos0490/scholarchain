        script_equivalent: "datasets/scripts/download.sh --dataset crossref"
        retrieved_at: "2026-11-20T02:06:32Z"
        subset_rule: "Same 10 DOIs as openalex-works-api-linked.jsonl; one request filter=doi:...,doi:...&rows=10; rows in DOI-list order. 10 of 10 found."
        transformation: "The 'abstract' key is removed from every item (copyright). All other fields unchanged."
        records: 10
        bytes: 47915
        sha256: "855c221447d1ab399bae0db0ab4c974a70c5f31bad65fdca53e06a05b14efa6c"
        license: "Bibliographic metadata: facts, not subject to copyright (Crossref licensing statement); abstracts removed"
    verification:
      source.landing_url: {status: VERIFIED, evidence: "HTTP 200 (70,387 bytes) on 2026-11-20T02:38:55Z"}
      source.download_url: {status: VERIFIED, evidence: "batch request on 2026-11-20T02:06:32Z returned status ok with 10 items; single-DOI request https://api.crossref.org/works/10.1145/337292.337434 on 2026-11-20T02:33:57Z returned HTTP 200"}
      source.alternative_bulk.landing_url: {status: VERIFIED, evidence: "HTTP 200 in run 1; lists the 2026 public data file with DOI 10.13003/nggf-vt1j"}
      source.alternative_bulk.dataset_doi: {status: VERIFIED, evidence: "run 1: doi.org resolves 10.13003/nggf-vt1j to a page titled 'March 2026 Public Data File from Crossref'"}
      source.alternative_bulk.requester_pays_bucket: {status: VERIFIED, evidence: "bulk-downloads documentation, re-checked 2026-11-20T02:38:55Z: 'The bucket is called api-snapshots-reqpays-crossref'"}
      source.alternative_bulk.billing: {status: VERIFIED, evidence: "bulk-downloads documentation text quoted in the billing field"}
      source.alternative_bulk.requester_pays_object_key:
        status: UNVERIFIED
        note: "Official URL to check: https://www.crossref.org/documentation/retrieve-metadata/bulk-downloads/ . On 2026-11-20 the documentation still shows only the 2025 key (March-2025-public-data-file-from-crossref.tar); the 2026 key is not listed. Listing the Requester Pays bucket bills the caller and needs human approval."

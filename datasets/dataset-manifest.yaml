        method: "HTTP GET Range bytes=0-0 on each ndownloader URL; Content-Range totals equal the figshare sizes for all 12 files"
        local_bytes: null
    s3_raw_prefix: "s3://${RAW_BUCKET}/orcid/snapshot=2026-10-13/"
    integrity:
      policy: >-
        Verify each archive against the figshare MD5 (source.files[].md5)
        after download; skip archives whose MD5 already matches. Compute
        SHA-256 at ingest and store it beside each raw object.
      publisher_checksum:
        algorithm: md5
        value: "per file, see source.files[].md5 (figshare computed_md5 == supplied_md5 for all 12 files)"
      sha256: null
    schema_version:
      source_schema: "ORCID message schema v3.0 (record namespace http://www.orcid.org/ns/record)"
      raw_schema_id: "orcid-xml/v3.0-pdf-2026"
    subset_rule:
      functional_run: >-
        Records from the summaries archive whose iD appears as an author ORCID
        in the selected DBLP, OpenAlex or Crossref subsets, plus their
        activities. Selection is by explicit iD list, never by name.
      sample: "See samples[].subset_rule."
    linkage_fields:
      - orcid
      - given_names
      - family_name
      - credit_name
      - works.external_ids          # work identifiers only (doi, eid, ...); titles are not kept
      - affiliations.organization.name
      - affiliations.organization.disambiguated_organization   # RINGGOLD / ROR / GRID
      - affiliations.start_date
      - affiliations.end_date
    privacy_policy:
      decided_by: "human architect, Phase 03 run 2 work order, decision 2d"
      scope: "public ORCID data only (visibility=public records from the Public Data File or Public API)"
      kept_categories:
        - "ORCID iD (common:orcid-identifier: uri, path, host)"
        - "name (person:name: given-names, family-name, credit-name)"
        - "affiliations (distinctions, educations, employments, invited-positions, memberships, qualifications, services; per summary: department-name, role-title, start-date, end-date, organization name and disambiguated-organization)"
        - "work identifiers (works group common:external-ids: external-id-type, external-id-value, external-id-relationship)"
      stripped: "everything else, explicitly including emails, biography, addresses (person addresses and organization addresses), other-names, keywords, researcher-urls, person external identifiers, history, preferences, sources, work titles, fundings, peer-reviews and research-resources"
      max_real_person_sample_records: 5
      enforcement:
        - "datasets/scripts/lib/orcid_reduce.py builds the allowlisted record; download.sh never installs the raw API response"
        - "validate-samples.sh (check_samples.py) enforces the allowlist: every element of an ORCID sample must sit on an allowed path (ORCID iD: uri, path, host; person name: given-names, family-name, credit-name; the 7 affiliation sections with department-name, role-title, start/end date, organization name and disambiguated-organization; works group external-ids with type, value, relationship) and carry only path, put-code or visibility attributes. Anything else fails, including person external-identifiers, work:title, common:source and history. Email(s), biography, address(es), other-name(s), keyword(s) and researcher-url(s) are also reported by name. More than 5 ORCID records in total fails."
    update_strategy: >-
      Published once per year. Pin one annual file per pipeline run. Between
      files, specific iDs may be refreshed from the Public API (rate-limited,
      non-commercial terms). On refresh, drop data that is no longer public.
    privacy_notes:
      - "POLICY (human decision 2d): public ORCID data only. Keep only the ORCID iD, name, affiliations and work identifiers. No emails, biographies or addresses; other-names, keywords and researcher-urls are also stripped. At most 5 real-person records in samples. See privacy_policy for the exact allowlist and its enforcement."
      - "Every record describes a real person; data is public by the record holder's choice but remains subject to privacy and publicity rights (ORCID Public Data File Use Policy)."
      - "The pipeline applies the same allowlist when it ingests ORCID records; fields outside the four kept categories are not stored in derived outputs."
      - "The only committed sample is ORCID's fictitious demonstration record (Josiah Carberry), reduced to the kept categories. No real-person record is committed (0 of the allowed 5)."
      - "Visibility can change; re-check on refresh and remove records or fields no longer public."
    limitations:
      - "A matching author name is not sufficient evidence of author identity."
      - "An ORCID iD is strong evidence only when the iD itself is present on both sides of a link."
      - "Works lists are self-asserted or member-asserted and can be incomplete or duplicated."
      - "Only records created or claimed by individuals are included."
    validation_commands:
      - "md5sum -c <list built from source.files[].md5>"
      - "tar -tzf ORCID_2026_10_summaries.tar.gz | head"
      - "datasets/scripts/validate-samples.sh"

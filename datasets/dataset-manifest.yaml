    full_retrieval:
      byte_cap: "source.files[].bytes per archive (enforced during the transfer)"
      max_time_seconds: 21600 # curl --max-time per archive attempt (largest archive is about 57 GB); an interrupted transfer resumes on the next run
      skip_rule: "skip an archive only when its size equals source.files[].bytes and its MD5 matches; a full-size archive that fails is quarantined as <file>.corrupt-<UTC> (never deleted) and fetched again"
    format:
      file_format: "tar archives of per-record XML (ORCID message schema v3.0, namespace http://www.orcid.org/ns/record); summaries/[3-digit checksum]/[iD].xml plus 11 activities archives"
      compression: "gzip (tar.gz)"

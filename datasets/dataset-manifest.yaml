# datasets/dataset-manifest.yaml
#
# Owner: dataset-engineer (sole writer). Spec: "Dataset manifest" and
# "Dataset portfolio" in spec/scholarchain-spec.md.
#
# Rules for every value in this file:
#   - Facts (URLs, licenses, sizes, checksums, dates) were observed on the
#     official page or in command output on the date in verification.*.
#   - A fact that could not be confirmed is null, and verification.<path>
#     records status UNVERIFIED plus what a human must check.
#   - No bucket name is hardcoded. ${RAW_BUCKET} is resolved from
#     configuration at run time.
#   - Sample entries are cross-checked against datasets/samples/SHA256SUMS by
#     datasets/scripts/validate-manifest.sh.
#   - Sample caps: <= 50 records and <= 200,000 bytes per file ("200 KB" =
#     200,000 bytes, human decision 2026-11-19, review finding 3).

manifest_schema_version: 1
owner: dataset-engineer
verified_on: "2026-11-20" # UTC date of the checks recorded below
sample_caps:
  max_records_per_file: 50
  max_bytes_per_file: 200000 # "200 KB" = 200,000 bytes (human decision 2026-11-19)
self_tests:
  - "datasets/scripts/test-download.sh   # offline: crossref batch identity, transfer caps, --max-time, openalex skip path"
  - "python3 -I datasets/scripts/lib/test_validators.py   # validator negatives: 200,000-byte cap, OpenAlex abstracts, ORCID allowlist, DBLP subset cap/windows/config names"
raw_prefix_template: "s3://${RAW_BUCKET}/{dataset}/snapshot={snapshot}/"
selected_datasets: [dblp, openalex, orcid, crossref]

datasets:
  # ------------------------------------------------------------------ DBLP
  dblp:
    name: "dblp computer science bibliography (XML release)"
    required: true
    owning_agent: dataset-engineer
    purpose: >-
      Seed dataset. Computer-science publication records (key, title, ordered
      author list, year, venue, electronic-edition links) from which
      publication teams and coauthor-pair candidates are derived.
    source:
      landing_url: "https://doi.org/10.4230/dblp.xml.2026-11-01"
      download_url: "https://drops.dagstuhl.de/storage/artifacts/dblp/xml/2026/dblp-2026-11-01.xml.gz"
      checksum_url: "https://drops.dagstuhl.de/storage/artifacts/dblp/xml/2026/dblp-2026-11-01.xml.gz.md5"
      dtd_url: "https://drops.dagstuhl.de/storage/artifacts/dblp/xml/2023/dblp-2023-06-28.dtd"
      dtd_checksum_url: "https://drops.dagstuhl.de/storage/artifacts/dblp/xml/2023/dblp-2023-06-28.dtd.md5"
      dtd_landing_url: "https://doi.org/10.4230/dblp.xml.dtd.2023-06-28"
      release_collection_url: "https://drops.dagstuhl.de/entities/collection/10.4230/dblp.xml"
      daily_dump_url: "https://dblp.org/xml/dblp.xml.gz"
      documentation_urls:
        - "https://dblp.org/xml/"
        - "https://dblp.org/xml/README.txt"
        - "https://dblp.org/xml/CHANGES.txt"
        - "https://dblp.org/faq/16154937"
        - "https://dblp.org/db/about/copyright.html"
    license:
      id: "CC0-1.0"
      url: "https://creativecommons.org/publicdomain/zero/1.0/"
      secondary: "ODC-BY-1.0 (http://opendatacommons.org/licenses/by/1.0/)"
      notes: >-
        dblp metadata (web pages and XML/JSON/RDF/RIS/BibTeX exports) is
        released under CC0 1.0, with ODC-BY 1.0 as a secondary license for
        compatibility. Attribution to dblp is requested, not required.
    snapshot:
      date: "2026-11-01"
      label: "dblp Monthly Snapshot XML Release of November 2026"
      artifact_last_modified: "Tue, 03 Nov 2026 09:01:15 GMT"
    retrieval:
      script: "datasets/scripts/download.sh"
      command: "SCHOLARCHAIN_ALLOW_FULL_DOWNLOAD=1 datasets/scripts/download.sh --full --dataset dblp --out <local-dir>"
      sample_command: "datasets/scripts/download.sh --dataset dblp"
      dry_run_command: "datasets/scripts/download.sh --dataset dblp --dry-run"
    full_retrieval:
      byte_cap: "size.observed.remote_bytes (enforced during the transfer; a resumed transfer is capped at the remaining bytes)"
      max_time_seconds: 7200 # curl --max-time per attempt; an interrupted transfer resumes on the next run
      skip_rule: "skip only when local size == remote_bytes, the publisher MD5 matches and gzip -t passes; a full-size file that fails is quarantined as <file>.corrupt-<UTC> (never deleted) and fetched again"
    format:
      file_format: "xml"
      compression: "gzip"
      encoding: "ISO-8859-1 (declared in the XML prolog); named character entities defined in the DTD"
      record_types: [article, inproceedings, proceedings, book, incollection, phdthesis, mastersthesis, www, data]
    size:
      expected:
        stated: "1.03 GB"
        source: "https://drops.dagstuhl.de/entities/artifact/10.4230/dblp.xml.2026-11-01 (Filesize)"
      observed:
        remote_bytes: 1116142729
        method: "HTTP HEAD Content-Length of download_url"
        local_bytes: null
      record_count: null
    s3_raw_prefix: "s3://${RAW_BUCKET}/dblp/snapshot=2026-11-01/"
    integrity:
      policy: >-
        Verify the publisher MD5 (checksum_url) after download, then run
        gzip -t, then compute SHA-256 and store it as <file>.sha256 beside the
        raw object. Raw objects are immutable; a new release gets a new prefix.
        The transfer is capped at remote_bytes during the transfer and bounded
        by full_retrieval.max_time_seconds.
      publisher_checksum:
        algorithm: md5
        value: "18ad5db59592406ec74289975c4b44cb"
      sha256: null
      http_etag_observed: "\"4286fc89-65f5b814192e5\""
      dtd_md5: "96e4283e71886dec2173718957293648"
    schema_version:
      source_schema: "dblp-2023-06-28.dtd"
      raw_schema_id: "dblp-xml/dtd-2023-06-28"
    subset_rule:
      functional_run: >-
        APPROVED by the human architect (rule: Phase 03 run 2 work order,
        decision 2a; values: human decision of 2026-11-20). Keep a dblp
        record if and only if (1) its element name (record type) is article
        or inproceedings, and (2) its <year> value is an integer Y with
        2000 <= Y <= 2025 (both bounds inclusive). Records with no <year> or
        a non-integer <year> are excluded. Partial-year 2026 is excluded (see
        limitations). No other filter is applied by the subset rule. The
        functional run is then bounded by a max-works cap of 100,000: it
        processes at most 100,000 of the works that pass the rule. The
        deterministic selection rule that decides which works are kept when
        the subset exceeds the cap is NOT yet defined; it belongs to
        hadoop-engineer (Phase 4) and is listed in
        subset_parameters.open_questions. The values are read from
        configuration at run time (subset_parameters.configuration), are not
        hardcoded in dataset scripts, and are recorded in the run manifest.
        The Hadoop extract counters are the evidence of how many works passed
        the rule and how many the run kept (spec "At least 100,000 DBLP works
        in the integrated functional run").
      sample: "See samples[].subset_rule. The committed excerpt is a stratified format sample covering all record types, not an application of the functional-run rule."
    subset_parameters:
      decided_by: "human architect"
      decided_on: "2026-11-20"
      record_types: [article, inproceedings] # fixed by the approved rule, whatever DBLP_SUBSET_RECORD_TYPES says
      year_field: "year"   # the record's <year> child element
      year_window:         # approved functional-run values, both inclusive
        start_year: 2000
        end_year: 2025
        constraint: "start_year <= end_year; end_year < year of snapshot.date (partial year excluded)"
      max_works: 100000    # cap that bounds the functional run; positive integer
      analysis_windows:    # default analysis windows: inclusive, sorted, non-overlapping, inside year_window
        - {start_year: 2000, end_year: 2005}
        - {start_year: 2006, end_year: 2010}
        - {start_year: 2011, end_year: 2015}
        - {start_year: 2016, end_year: 2020}
        - {start_year: 2021, end_year: 2025}
      configuration:
        values_file: "modules/core/src/main/resources/scholarchain/conf/dev.conf"
        values_file_owner: domain-engineer
        env_bindings_file: "modules/core/src/main/resources/scholarchain/env-overrides.conf"
        keys:
          record_types:
            config_key: "scholarchain.datasets.dblpSubset.recordTypes"
            env_var: "DBLP_SUBSET_RECORD_TYPES"
            dev_value: "article,inproceedings"
            status: "PENDING human confirmation as a configurable key (domain-engineer repair 2, manual action 2). The approved rule fixes the types to article and inproceedings regardless of this key."
          start_year:
            config_key: "scholarchain.datasets.dblpSubset.startYear"
            env_var: "DBLP_SUBSET_START_YEAR"
            dev_value: 2000
          end_year:
            config_key: "scholarchain.datasets.dblpSubset.endYear"
            env_var: "DBLP_SUBSET_END_YEAR"
            dev_value: 2025
          max_works:
            config_key: "scholarchain.datasets.dblpSubset.maxWorks"
            env_var: "DBLP_SUBSET_MAX_WORKS"
            dev_value: 100000
          analysis_windows:
            config_key: "scholarchain.graph.windows"
            env_var: "SCHOLARCHAIN_GRAPH_WINDOWS"
            dev_value: "2000-2005,2006-2010,2011-2015,2016-2020,2021-2025"
        note: >-
          The values live in modules/core/src/main/resources/scholarchain/conf/dev.conf,
          owned by domain-engineer, which also owns the configuration contract
          and loader. Environment variables override that file. The values
          are not hardcoded in dataset scripts: no script under
          datasets/scripts/ reads or applies the subset rule (it is applied by
          the Hadoop extract stage). This manifest mirrors the approved values
          for review; if they change, dev.conf and this block must change
          together.
      open_questions:
        - id: dblp-max-works-selection
          owner: hadoop-engineer
          phase: 4
          question: >-
            Which works are kept when the works passing the subset rule exceed
            max_works? The deterministic selection rule (ordering and
            tie-breaking) is not defined. It must be deterministic for a fixed
            snapshot and configuration, and recorded in the run manifest.
            dataset-engineer has not chosen one.
    linkage_fields:
      - dblp_key
      - doi                  # from <ee> links of the form https://doi.org/...
      - ee_urls              # other electronic editions, e.g. arXiv
      - normalized_title
      - normalized_author_sequence
      - author_orcid_attribute  # <author orcid="..."> when dblp supplies it
      - year
      - venue                # journal / booktitle / stream
      - crossref_key         # parent proceedings key (<crossref>), not Crossref Inc.
    update_strategy: >-
      dblp publishes a stable monthly XML snapshot (DOI 10.4230/dblp.xml.YYYY-MM-DD)
      and a daily-changing dump at dblp.org/xml. Pin one monthly snapshot per
      pipeline run. To update, verify the newer release (MD5, size, license),
      ingest it under a new snapshot prefix, and re-run the pipeline. There is
      no incremental diff feed; mdate attributes allow change detection.
    privacy_notes:
      - "Contains personal names of authors and editors and, in www records, person homepage URLs."
      - "Names are public bibliographic facts, but derived profiles (collaboration metrics) are about real people; publish only aggregate results needed for the course."
    limitations:
      - "A matching author name is not sufficient evidence of author identity."
      - "dblp disambiguates homonyms with numeric suffixes (e.g. 'Manish Singh 0001'); suffix assignment can change between releases."
      - "Many reference/encyclopedia records have no author."
      - "Record order in the dump is grouped by key prefix (reference/, data/, ms/, series/, conf/, ...); the first megabytes are not representative."
      - "Records can be adjacent on one line (</incollection><incollection ...>); parsers must not assume one record per line."
      - "DOIs exist only where dblp recorded an https://doi.org/ <ee> link."
      - "Partial-year 2026 is excluded (human decision, 2026-11-20). The 2026-11-01 snapshot contains records with <year>2026</year> (the committed excerpt has 4: inproceedings conf/dac/GuoXJLHYZZS26 and data records data/13/WangB26a, data/13/VasilevaWRDJL26, data/13/Xu26); the functional-run rule drops them because end_year is 2025. Collaboration in 2026 is therefore absent from every graph and metric built on this subset."
      - "The max-works cap (100,000) bounds the functional run, so the run can process only part of the works that pass the subset rule. Which works are kept is not yet defined (subset_parameters.open_questions, owner hadoop-engineer). Until it is, no completeness claim about the 2000-2025 article and inproceedings population can be made from a capped run."
      - "The committed excerpt has no journals/ article records and no www (person/homepage) records, because the first 16 MiB of the dump do not reach those key prefixes. Per-record XML (https://dblp.org/rec/<key>.xml, https://dblp.org/pid/<pid>.xml) could not be used to add them: on 2026-11-20T02:31:57Z one request to https://dblp.org/rec/journals/cacm/DeanG08.xml returned HTTP 202 with an HTML bot-challenge page (title 'Making sure you're not a bot!'), not XML. It was not retried and the challenge was not bypassed; the pid endpoint was not attempted because the challenge applies to the dblp.org host."
    validation_commands:
      - "gzip -t dblp-2026-11-01.xml.gz"
      - "echo '18ad5db59592406ec74289975c4b44cb  dblp-2026-11-01.xml.gz' | md5sum -c -"
      - "sha256sum -c dblp-2026-11-01.xml.gz.sha256"
      - "datasets/scripts/validate-samples.sh"
    sampling:
      output: "dblp/dblp-2026-11-01-excerpt.xml"
      dtd_output: "dblp/dblp-2023-06-28.dtd"
      max_compressed_bytes: 16777216
    samples:
      - path: "dblp/dblp-2026-11-01-excerpt.xml"
        description: "50 complete records from the pinned November 2026 release, verbatim bytes, original XML declaration and DOCTYPE, closing </dblp> appended."
        source_url: "https://drops.dagstuhl.de/storage/artifacts/dblp/xml/2026/dblp-2026-11-01.xml.gz"
        retrieval_command: "curl --fail -sS -L --range 0-16777215 <source_url> | python3 -I datasets/scripts/lib/dblp_sample.py <out> 16777216"
        script_equivalent: "datasets/scripts/download.sh --dataset dblp"
        retrieved_at: "2026-11-20T02:06:06Z"
        subset_rule: >-
          Stream order over at most 16 MiB of the compressed release (7,798,784
          bytes were read before all quotas filled). Each record goes to the
          first stratum with quota left whose predicate matches:
          conf/ inproceedings with >= 2 authors, a doi.org ee and an entity
          reference in an author name (6); conf/ inproceedings with >= 2
          authors and a doi.org ee (24); series/ inproceedings with >= 2
          authors (3); reference/ incollection with an author (3); data (3);
          mastersthesis (2); phdthesis (2); proceedings (3); book (2);
          dblpnote/ article (2).
        transformation: "Record selection only. Record bytes unchanged (ISO-8859-1, entity references intact)."
        records: 50
        bytes: 25538
        sha256: "b5d5c46dbe60284c46ddc50174ea2106fd6f55f4623611c310dc8e0b177428a1"
        license: "CC0-1.0"
      - path: "dblp/dblp-2023-06-28.dtd"
        description: "The DTD referenced by the release DOCTYPE; needed to resolve named character entities offline."
        source_url: "https://drops.dagstuhl.de/storage/artifacts/dblp/xml/2023/dblp-2023-06-28.dtd"
        retrieval_command: "curl --fail -sS -L --max-filesize 65536 -o dtd <source_url>; curl --fail -sS -L --max-filesize 1024 <source_url>.md5; md5sum dtd"
        script_equivalent: "datasets/scripts/download.sh --dataset dblp"
        retrieved_at: "2026-11-20T02:06:06Z"
        subset_rule: "Whole file (13,134 bytes)."
        transformation: "None. md5 96e4283e71886dec2173718957293648 equals the publisher .md5."
        records: 0
        bytes: 13134
        sha256: "03ec35cb34a4227572a0e89da407b06b6e44a6cc23e19cabc3b49b702a5f897d"
        license: "CC0-1.0"
    verification:
      source.landing_url: {status: VERIFIED, evidence: "curl -sSIL https://doi.org/10.4230/dblp.xml.2026-11-01 -> 302 to drops.dagstuhl.de artifact page, HTTP 200"}
      source.download_url: {status: VERIFIED, evidence: "linked from the artifact page; HTTP HEAD 200, Content-Length 1116142729"}
      source.checksum_url: {status: VERIFIED, evidence: "fetched; content '18ad5db59592406ec74289975c4b44cb  dblp-2026-11-01.xml.gz', same value shown as MD5 Sum on the artifact page"}
      source.dtd_url: {status: VERIFIED, evidence: "linked from https://drops.dagstuhl.de/entities/artifact/10.4230/dblp.xml.dtd.2023-06-28; fetched"}
      license: {status: VERIFIED, evidence: "https://dblp.org/xml/README.txt section 1 (CC0 1.0 primary, ODC-BY 1.0 secondary); artifact page schema.org license = https://creativecommons.org/publicdomain/zero/1.0/legalcode"}
      snapshot.date: {status: VERIFIED, evidence: "release DOI 10.4230/dblp.xml.2026-11-01 and file name dblp-2026-11-01.xml.gz"}
      size.expected: {status: VERIFIED, evidence: "artifact page 'Filesize: 1.03 GB'"}
      size.observed.remote_bytes: {status: VERIFIED, evidence: "HTTP HEAD Content-Length: 1116142729"}
      size.observed.local_bytes:
        status: UNVERIFIED
        note: "Official URL to check: https://drops.dagstuhl.de/entities/artifact/10.4230/dblp.xml.2026-11-01 (Filesize; download_url Content-Length 1116142729). The full release was not downloaded in Phase 03 (bounded sampling only). A human-approved full download must record the local byte count."
      size.record_count:
        status: UNVERIFIED
        note: "Official URL to check: https://drops.dagstuhl.de/entities/artifact/10.4230/dblp.xml.2026-11-01 (no per-release record count is published there). Record it from the first full Hadoop extract run."
      integrity.publisher_checksum: {status: VERIFIED, evidence: "checksum_url content and artifact page MD5 Sum agree"}
      integrity.sha256:
        status: UNVERIFIED
        note: "Official URL to check: https://drops.dagstuhl.de/storage/artifacts/dblp/xml/2026/dblp-2026-11-01.xml.gz.md5 (dblp publishes MD5 only). SHA-256 must be computed after a full download (download.sh --full writes <file>.sha256) and copied here by a human-reviewed manifest update."
      integrity.dtd_md5: {status: VERIFIED, evidence: "artifact page MD5 Sum for dblp-2023-06-28.dtd; download.sh compares it with the fetched file"}

  # -------------------------------------------------------------- OpenAlex
  openalex:
    name: "OpenAlex standard-format snapshot (JSON Lines)"
    required: false
    owning_agent: dataset-engineer
    purpose: >-
      Canonical author candidates (OpenAlex author IDs, ORCID when present),
      institutions (ROR), topics, sources/venues, and work identifiers used to
      enrich and link DBLP works and researchers.
    source:
      landing_url: "https://help.openalex.org/access/snapshot/"
      download_url: "https://openalex.s3.amazonaws.com/data/jsonl/"
      snapshot_manifest_url: "https://openalex.s3.amazonaws.com/data/jsonl/manifest.json"
      s3_uri: "s3://openalex/data/jsonl/"
      release_notes_url: "https://openalex.s3.amazonaws.com/RELEASE_NOTES.txt"
      license_file_url: "https://openalex.s3.amazonaws.com/LICENSE.txt"
      api_url: "https://api.openalex.org/works"
      documentation_urls:
        - "https://help.openalex.org/access/snapshot/"
        - "https://help.openalex.org/access/sync/"
        - "https://help.openalex.org/tutorials/download-the-snapshot/"
        - "https://openalex.s3.amazonaws.com/README.txt"
    license:
      id: "CC0-1.0"
      url: "https://creativecommons.org/publicdomain/zero/1.0/"
      notes: "Bucket README states 'License: LICENSE.txt (CC0)'; LICENSE.txt is the CC0 1.0 Universal legal code."
    snapshot:
      date: "2026-10-14"
      label: "OpenAlex public snapshot RELEASE 2026-10-14 (quarterly)"
      artifact_last_modified: "2026-10-14T18:27:44Z (data/jsonl/manifest.json)"
    retrieval:
      script: "datasets/scripts/download.sh"
      command: "SCHOLARCHAIN_ALLOW_FULL_DOWNLOAD=1 datasets/scripts/download.sh --full --dataset openalex --openalex-entities works,authors,institutions,sources,topics --out <local-dir>"
      sample_command: "datasets/scripts/download.sh --dataset openalex"
      dry_run_command: "datasets/scripts/download.sh --dataset openalex --dry-run"
    full_retrieval:
      byte_cap: "each partition's manifest.json meta.content_length (enforced during the transfer)"
      max_time_seconds: 3600 # curl --max-time per partition attempt
      skip_rule: "skip a partition only when its size equals content_length, gzip -t passes, and its recorded <partition>.sha256 verifies (when present; written after every verified fetch). A shorter file is resumed; a full-length file that fails is quarantined as <file>.corrupt-<UTC> (never deleted) and fetched again."
    sample_policy:
      decided_by: "human architect, 2026-11-19 (Phase 03 review finding 4)"
      strip_key: "abstract_inverted_index"
      reason: >-
        Same stance as Crossref: abstracts are publisher or author copyright
        even when an aggregator redistributes them, and an inverted index can
        be turned back into the abstract text. The key is removed from every
        committed OpenAlex sample. Abstracts are not used for linking.
      method: >-
        datasets/scripts/lib/sample_tools.py strip_key_bytes removes the
        top-level key and leaves every other byte of the line unchanged
        (number formats such as 2.0E-4, escapes, key order). The result is
        checked to parse to the original record minus that key. Snapshot
        excerpts are stripped BEFORE the 50-record / 200,000-byte caps are
        applied; API samples are stripped as they are written.
      provenance: "Records keep their OpenAlex IDs (id field) and all other fields; each sample's transformation names the removed key and, where the strip changed the file, the sha256 and size of the unstripped excerpt."
      enforcement:
        - "download.sh strips the key before install, so a re-run reproduces the committed files"
        - "validate-samples.sh (check_samples.py) fails when any OpenAlex sample line has a non-null, non-empty abstract_inverted_index"
        - "validate-manifest.sh (validate_manifest.py) fails when this policy is missing or a sample transformation does not mention the key"
    format:
      file_format: "jsonl (one JSON entity per line), partitioned by updated_date=YYYY-MM-DD/part_NNNN.gz; parquet copy also published under data/parquet/"
      compression: "gzip"
      encoding: "UTF-8"
    size:
      expected:
        all_jsonl_bytes: 755513952946
        works_jsonl_bytes: 675298563638
        authors_jsonl_bytes: 74121890690
        works_records: 464765485
        authors_records: 101066311
        all_records: 586176148
        source: "data/jsonl/manifest.json meta.content_length / meta.record_count and per-entity values"
      observed:
        remote_bytes: 755749312341
        method: >-
          Anonymous S3 ListObjectsV2 over https://openalex.s3.amazonaws.com/?prefix=data/jsonl/
          (3,131 objects). Works prefix: 1,900 objects, 675,533,022,977 bytes =
          manifest works files (675,298,563,638) + works/deleted_ids.csv.gz
          (234,102,326) + works/manifest.json (357,013). Authors prefix: 518
          objects, 74,121,988,400 bytes = manifest authors files + authors/manifest.json (97,710).
        local_bytes: null
      snapshot_manifest_bytes: 671964
      snapshot_manifest_sha256: "2b3d611b3ec93912b7b655ee139310936048a689c0f3508052a73af03a6c453f"
    s3_raw_prefix: "s3://${RAW_BUCKET}/openalex/snapshot=2026-10-14/"
    integrity:
      policy: >-
        Keep the snapshot data/jsonl/manifest.json (sha256 recorded here) as
        the file list. For each partition, the downloaded byte length must
        equal manifest content_length (also the byte cap during the transfer)
        and gzip -t must pass; download.sh then writes <partition>.sha256 and
        re-verifies size, gzip -t and that sha256 before skipping a partition
        on a later run. Record count may be checked against meta.record_count. OpenAlex publishes no per-file
        content hash; S3 ETags are recorded for change detection only (they
        are not MD5 for multipart uploads). SHA-256 is computed at ingest and
        stored beside each raw object.
      publisher_checksum: null
      sha256: null
    schema_version:
      source_schema: "OpenAlex standard-format snapshot, release 2026-10-14 (entity JSON as documented at help.openalex.org)"
      raw_schema_id: "openalex-jsonl/2026-10-14"
    subset_rule:
      functional_run: >-
        Works whose DOI matches a DOI in the selected DBLP subset, plus the
        authors, institutions, sources and topics those works reference.
        Join performed by the Hadoop normalizer stage; the DOI list is the
        Hadoop DBLP output for the same run.
      sample: "See samples[].subset_rule."
    linkage_fields:
      - doi
      - openalex_work_id
      - ids                 # mag, pmid, pmcid when present
      - title
      - publication_year
      - authorships.author.id
      - authorships.author.orcid
      - authorships.raw_author_name
      - authorships.author_position
      - authorships.institutions.id
      - authorships.institutions.ror
      - primary_location.source.id
      - primary_location.source.issn_l
      - topics.id
    update_strategy: >-
      Public snapshot is quarterly (second Wednesday of January, April, July
      and October per RELEASE_NOTES.txt). The public bucket holds only the
      latest release, so pin by copying the needed partitions to the raw
      prefix. Incremental sync: partitions are keyed by updated_date; fetch
      partitions newer than the last ingested updated_date and apply
      works/deleted_ids.csv.gz. Records also drift continuously in the API.
    privacy_notes:
      - "Author entities contain personal names, ORCID iDs, and affiliation histories."
      - "OpenAlex author profiles are algorithmic clusters; treat them as candidates, not identity ground truth."
    limitations:
      - "A matching author name is not sufficient evidence of author identity."
      - "Release notes document past over-merged and split author profiles (e.g. 2026-04-29, 2026-05-22); author IDs can change between releases."
      - "API default view excludes 'xpac' works; the snapshot includes them (is_xpac). Filter consistently."
      - "The public bucket keeps only the latest release; earlier partitions disappear when a new release lands."
      - "Abstracts are only available as abstract_inverted_index and are not used for linking. Committed samples do not contain them (sample_policy)."
    validation_commands:
      - "sha256sum manifest.json   # expect 2b3d611b3ec93912b7b655ee139310936048a689c0f3508052a73af03a6c453f"
      - "gzip -t <partition>.gz"
      - "python3 -I -c 'import gzip,json,sys; [json.loads(l) for l in gzip.open(sys.argv[1])]' <partition>.gz"
      - "datasets/scripts/validate-samples.sh"
    sampling:
      https_base: "https://openalex.s3.amazonaws.com/"
      api_works_url: "https://api.openalex.org/works"
      api_select: "id,doi,title,display_name,publication_year,publication_date,ids,type,authorships,primary_location,primary_topic,topics,cited_by_count,referenced_works_count,is_retracted,updated_date,created_date"
